<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>{{ movie.title }}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar">

<div class="container">

<span class="brand">

🎬 CineMatch

</span>

</div>

</nav>

<div class="container mt-5">

<div class="row">

<div class="col-md-4">

{% if tmdb and tmdb.poster %}

<img
src="{{ tmdb.poster }}"
class="img-fluid rounded shadow">

{% else %}

<img
src="https://placehold.co/400x600/222222/FFFFFF?text=No+Poster"
class="img-fluid rounded">

{% endif %}

</div>

<div class="col-md-8">

<h1>

{{ movie.title }}

</h1>

<hr>

<p>

<b>Genres:</b>

{{ movie.genres }}

</p>

<p>

⭐

{{ tmdb.rating if tmdb else "N/A" }}

</p>

<p>

📅

{{ tmdb.release_date if tmdb else "Unknown" }}

</p>

<p>

{{ tmdb.overview if tmdb else "Overview not available." }}

</p>

<a
href="/"
class="btn btn-danger">

Home

</a>

</div>

</div>

</div>

</body>

</html>
